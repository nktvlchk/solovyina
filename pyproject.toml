[project]
name = "solovyina"
version = "0.6.0"
description = "Telegram helper for Russian speakers switching to Ukrainian"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Cyrillic/typographic characters are intended
  "S101",                         # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S314", "S603", "S607"]  # parsing a trusted, tracked .dix file
"drip.py" = ["S310"]  # constant https://api.telegram.org URLs
"src/bot/storage/repositories.py" = ["S608"]
"src/bot/providers/anthropic.py" = ["E501"]  # prompt text  # table names are constants, values are parameters
